<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toll of Violence — Live Projection</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ============================================================
     DESIGNER CONFIG
     ============================================================ */
  :root {
    --bg: #0d0203;                 /* page background */
    --stage-width: 50vw;           /* how much of the screen width the image occupies */
  }
</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 4vh 4vw;
  }

  /* ============================================================
     TOLL IMAGE
     This is the entire design now — number, hearts, and outline
     are all baked into one exported image from Canva.

     TO UPDATE THE NUMBER:
     1. Update the number in your Canva design and export it as a
        PNG (transparent background, same export settings as before:
        PNG-24, RGB/sRGB, ~2400–3200px wide).
     2. Replace toll-image.png in this same folder with the new
        export, keeping the exact same filename.
     3. Bump the ?v=1 below to ?v=2 (then ?v=3, etc. next time) —
        this forces the browser to load the new image instead of
        showing a cached older one.
     4. Commit and push as usual (or hand this whole step to
        whoever is doing the GitHub side).
     ============================================================ */
  .toll-image {
    display: block;
    width: var(--stage-width, 50vw);
    max-width: 90vw;
    height: auto;
  }
</style>
</head>
<body>

  <img class="toll-image" src="toll-image.png?v=1" alt="Toll of violence" id="toll-image">

</body>
</html>
